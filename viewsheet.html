<!DOCTYPE html>
<html>

  </head>
<style>
            .floating-btn {
            position: fixed;       /* Anchors the button to the viewport */
            bottom: 25px;          /* Distance from the bottom of the screen */
            right: 25px;
            background-color: transparent;          /* Distance from the right of the screen * /* Green background */
            color: white;          /* Text color */
            padding: 15px 20px;    /* Button size */
            border: none;          /* Remove default border */
            border-radius: 50px;   /* Pill/Rounded shape */
            font-size: 16px;       /* Font size */
            font-weight: bold;
            cursor: pointer;       /* Pointer cursor on hover */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); /* Adds a shadow for depth */
            z-index: 1000;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
</style>
  <body>
  <iframe src="https://script.google.com/macros/s/AKfycbySYFg_lhvrEBxr27iJJlEW-Uft4P2x1x3reKE3MBlA7Jp47akpF57sQHblpxZmk34w/exec" width="100%" height="800px">
  </iframe>   
        <button class="floating-btn"  onclick="{window.location='./index.html';}">🏠</button>
  </body>
</html>
